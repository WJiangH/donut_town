display_information:
  name: Donut Town
features:
  bot_user:
    display_name: Donut Bot
    always_online: false
oauth_config:
  redirect_urls:
    - https://YOUR-PUBLIC-HTTPS-URL/auth/slack/callback
  scopes:
    user:
      - openid
      - profile
    bot:
      - channels:read
      - groups:read
      - users:read
      - chat:write
      - im:write
settings:
  interactivity:
    is_enabled: true
    request_url: https://YOUR-PUBLIC-HTTPS-URL/slack/interactions
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
