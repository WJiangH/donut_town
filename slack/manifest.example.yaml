# Bootstrap manifest. Run npm run setup -- --url https://YOUR-TOWN.onrender.com
# to generate the JSON version with the final redirect and interaction URLs.
display_information:
  name: Donut Town
  description: A little pixel world for your Slack team.
features:
  bot_user:
    display_name: Donut Bot
    always_online: false
oauth_config:
  redirect_urls: []
  scopes:
    user:
      - openid
      - profile
    bot:
      - channels:read
      - groups:read
      - users:read
      - chat:write
      - im:write
settings:
  interactivity:
    is_enabled: false
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
