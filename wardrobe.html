<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Donut Town · 我的试衣间</title>
<link rel="stylesheet" href="/wardrobe.css">
<header><a href="/">D<span>DONUT TOWN</span></a><span>角色工坊 / 01</span></header>
<main>
  <section class="intro"><p class="eyebrow">SAME YOU. A LITTLE DIFFERENT.</p><h1>你的形象，<br>随心搭配。</h1><p>保留熟悉的脸和发型，换一件外套，试一副墨镜。</p></section>
  <div class="workspace">
    <section class="fitting" aria-label="角色预览">
      <div class="stage"><span class="stage-label">DONUT TOWN · FITTING ROOM</span><div class="platform"></div><canvas id="person" width="240" height="350" aria-label="当前装扮"></canvas><span id="lookLabel">原装造型</span><span class="scale-label">放大查看</span></div>
      <div class="directions" aria-label="人物朝向"><button data-dir="down" aria-pressed="true">正面</button><button data-dir="right" aria-pressed="false">右侧</button><button data-dir="up" aria-pressed="false">背面</button><button data-dir="left" aria-pressed="false">左侧</button></div>
      <div class="motion"><button id="walk" aria-pressed="false">▶ 看看走路</button><button id="compare" aria-pressed="false">对比原装</button><button id="reset">恢复原装</button></div>
      <div class="town-sample"><canvas id="townPerson" width="88" height="88" aria-label="Town 实际大小预览"></canvas><span>在 Town 中的大小</span></div>
    </section>
    <section class="options" aria-label="装扮选择">
      <p class="eyebrow">YOUR WARDROBE</p><h2>今天，换一点不同。</h2>
      <fieldset data-slot="eyewear"><legend><span>01</span> 眼镜</legend><div class="choices"><button data-item="none" aria-pressed="true"><i class="glasses clear"></i>原款眼镜<small>熟悉的样子</small></button><button data-item="smoke" aria-pressed="false"><i class="glasses"></i>烟灰墨镜<small>深色镜片</small></button></div></fieldset>
      <fieldset data-slot="jacket"><legend><span>02</span> 外套</legend><div class="choices"><button data-item="original" aria-pressed="true"><i style="--swatch:#333438"></i>炭灰<small>原款剪裁</small></button><button data-item="navy" aria-pressed="false"><i style="--swatch:#2a496c"></i>海军蓝<small>原款剪裁</small></button><button data-item="olive" aria-pressed="false"><i style="--swatch:#505b36"></i>橄榄绿<small>原款剪裁</small></button></div></fieldset>
      <fieldset data-slot="shoes"><legend><span>03</span> 鞋子</legend><div class="choices"><button data-item="original" aria-pressed="true"><i style="--swatch:#352920"></i>深棕<small>原款鞋型</small></button><button data-item="cream" aria-pressed="false"><i style="--swatch:#d3cab0"></i>奶油白<small>原款鞋型</small></button><button data-item="burgundy" aria-pressed="false"><i style="--swatch:#752f35"></i>酒红<small>原款鞋型</small></button></div></fieldset>
      <p id="status" role="status">正在准备你的试衣间…</p>
      <p class="scope">试穿选择只保存在本机，不改变其他成员看到的装扮。当前为个人适配原型；走路沿用现有草稿动作。</p>
    </section>
  </div>
</main>
<script type="module" src="/wardrobe.mjs"></script>
</html>
